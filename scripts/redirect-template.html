<!DOCTYPE html>
<!-- 用法：把本文件复制为旧 GitHub Pages 仓库的 index.html，
     并将全部 __TARGET__ 替换为新站对应地址（如 https://cavno.pages.dev/reading/）。
     GitHub Pages 不支持服务端 301，此为 meta + JS 双保险跳转。 -->
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>页面已迁移</title>
<link rel="canonical" href="__TARGET__">
<meta http-equiv="refresh" content="0; url=__TARGET__">
<script>location.replace("__TARGET__");</script>
</head>
<body>
<p>本页已迁移至 <a href="__TARGET__">__TARGET__</a></p>
</body>
</html>
