# Sveltia CMS 配置（兼容 Decap CMS 格式）
# 上线前需替换两处：backend.repo 与 backend.base_url（见 README 第 3 节）
backend:
  name: github
  repo: cavno/cavno-site                # ← 改成 你的用户名/仓库名
  branch: main
  base_url: https://sveltia-cms-auth.cavno-site.tchow.workers.dev   # ← 部署 OAuth Worker 后替换

site_url: https://cavno-site.tchow.workers.dev/
media_folder: public/covers
public_folder: /covers

collections:
  - name: items
    label: 作品条目
    label_singular: 条目
    folder: src/content/items
    create: true
    extension: md
    format: frontmatter
    slug: "{{fields.section}}-{{slug}}"
    identifier_field: title
    sortable_fields: [date, title]
    fields:
      - { name: title, label: 标题, widget: string }
      - name: section
        label: 一级板块
        widget: select
        options:
          - { label: "Investing 投资", value: investing }
          - { label: "Reading & Thinking 阅读与思考", value: reading }
          - { label: "Life & Skills 生活与技能", value: life }
          - { label: "Working 工作", value: working }
      - { name: subsection, label: 二级栏目 slug, widget: string,
          hint: "如 books / options / driving，需与「站点设置 → 导航结构」中的 slug 一致" }
      - { name: href, label: 页面路径, widget: string,
          hint: "如 /apps/reading/books/xxx.html，或外部完整 URL" }
      - { name: date, label: 日期, widget: datetime, format: "YYYY-MM-DD", time_format: false }
      - { name: tags, label: 标签, widget: list, required: false, default: [] }
      - { name: summary, label: 摘要, widget: text, required: false }

  - name: settings
    label: 站点设置
    files:
      - file: src/content/nav.json
        name: nav
        label: 导航结构（两级菜单）
        fields:
          - name: sections
            label: 一级板块
            widget: list
            fields:
              - { name: slug, label: Slug, widget: string }
              - { name: en, label: 英文名, widget: string }
              - { name: zh, label: 中文名, widget: string }
              - { name: short, label: 短标签, widget: string, hint: "用于条目卡片角标，如 Reading" }
              - { name: desc, label: 描述, widget: text }
              - { name: planned, label: 标记为拟设, widget: boolean, default: false, required: false }
              - name: subsections
                label: 二级栏目
                widget: list
                fields:
                  - { name: slug, label: Slug, widget: string }
                  - { name: en, label: 英文名, widget: string }
                  - { name: zh, label: 中文名, widget: string }
                  - { name: desc, label: 描述, widget: string, required: false }
